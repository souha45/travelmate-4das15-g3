# Nom du microservice
spring.application.name=flight-service

# Port
server.port=8082

# Configuration MySQL (XAMPP)
spring.datasource.url=jdbc:mysql://localhost:3306/flight_db?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC
spring.datasource.username=root
spring.datasource.password=
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Configuration JPA / Hibernate (pour créer les tables automatiquement)
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# Eureka
eureka.client.service-url.defaultZone=http://localhost:8761/eureka/

spring.cloud.config.enabled=false

# Réservations
flight.reservation.duree-expiration-minutes=30
flight.reservation.verification-expiration-ms=60000

# JWT : DOIT être identique au secret de user-service (plus tard : config-server)
app.jwt.secret=travelmate-user-service-secret-key-change-me-0123456789