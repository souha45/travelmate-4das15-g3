# Nom du microservice
spring.application.name=flight-service

# Port
server.port=8082

# Configuration MySQL (XAMPP)
spring.datasource.url=jdbc:mysql://localhost:3306/flight_db?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=Africa/Tunis
spring.datasource.username=root
spring.datasource.password=
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Configuration JPA / Hibernate (pour créer les tables automatiquement)
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# Eureka
eureka.client.service-url.defaultZone=http://localhost:8761/eureka/

eureka.client.register-with-eureka=true
eureka.client.fetch-registry=true
eureka.instance.prefer-ip-address=true

spring.cloud.config.enabled=false

# Réservations
flight.reservation.duree-expiration-minutes=30
flight.reservation.verification-expiration-ms=60000