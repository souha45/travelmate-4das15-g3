# Nom du service et Port
spring.application.name=payment-service
server.port=8086

# Connexion PostgreSQL (Ton mot de passe est "root")
spring.datasource.url=jdbc:postgresql://localhost:5432/payment_db
spring.datasource.username=postgres
spring.datasource.password=ghof123?!789
spring.datasource.driver-class-name=org.postgresql.Driver

# Hibernate (Création automatique des tables)
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.open-in-view=false
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect

# Eureka (Optionnel pour l'instant, mais on le laisse)
eureka.client.service-url.defaultZone=http://localhost:8761/eureka/
eureka.client.register-with-eureka=true
eureka.client.fetch-registry=true
eureka.instance.prefer-ip-address=true

# Swagger
springdoc.swagger-ui.path=/swagger-ui.html

# TVA
payment.tva-rate=0.19