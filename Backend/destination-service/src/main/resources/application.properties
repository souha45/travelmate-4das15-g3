# Nom du microservice
spring.application.name=destination-service



# Port
server.port=8085

# Configuration MongoDB
spring.mongodb.uri=mongodb://localhost:27017/destination_db
spring.data.mongodb.auto-index-creation=true

app.jwt.secret=travelmate-user-service-secret-key-change-me-0123456789
services.user.url=http://localhost:8081

# Configuration RabbitMQ
spring.rabbitmq.host=localhost
spring.rabbitmq.port=5672
spring.rabbitmq.username=guest
spring.rabbitmq.password=guest

# Eureka
eureka.client.service-url.defaultZone=http://localhost:8761/eureka/
eureka.client.register-with-eureka=true
eureka.client.fetch-registry=true
eureka.instance.prefer-ip-address=true

spring.cloud.config.enabled=false